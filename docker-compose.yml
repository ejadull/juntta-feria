# Development only. Run from repository root after creating apps/api and apps/web.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feriaos}
      POSTGRES_USER: ${POSTGRES_USER:-feriaos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  s3:
    image: localstack/localstack:stable
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-juntta-feria-local}
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"s3\"'"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    working_dir: /workspace
    command: npm run start:dev --workspace api
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-feriaos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-feriaos}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:4566
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-feriaos-local}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Define S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Define S3_SECRET_KEY in .env}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - ./apps/api:/workspace/apps/api
      - api_node_modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    working_dir: /workspace
    command: npm run start --workspace web -- --host 0.0.0.0 --port ${WEB_PORT:-4200}
    environment:
      NODE_ENV: development
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:${WEB_PORT:-4200}"
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/node_modules
    depends_on:
      - api
volumes:
  postgres_data:
  redis_data:
  localstack_data:
  api_node_modules:
  web_node_modules:
