<svg
  #svg
  class="plan"
  [attr.viewBox]="viewBoxAttr()"
  preserveAspectRatio="xMidYMid meet"
  role="group"
  tabindex="0"
  [attr.aria-label]="ariaLabel()"
  (keydown)="onKey($event)"
  (pointerdown)="onBackgroundDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  (wheel)="onWheel($event)"
>
  <rect class="floor" x="0" y="0" [attr.width]="widthM()" [attr.height]="heightM()" />

  @for (line of gridLines(); track line.key) {
    <line
      class="grid"
      [class.major]="line.major"
      [attr.x1]="line.x1"
      [attr.y1]="line.y1"
      [attr.x2]="line.x2"
      [attr.y2]="line.y2"
    />
  }

  @for (x of rulerX(); track x) {
    <text class="ruler" [attr.x]="x" y="-0.8" text-anchor="middle">{{ x }} m</text>
  }
  @for (y of rulerY(); track y) {
    <text class="ruler" x="-0.6" [attr.y]="y + 0.2" text-anchor="end">{{ y }}</text>
  }

  <rect class="wall" x="0" y="0" [attr.width]="widthM()" [attr.height]="heightM()" />

  @for (s of shapes(); track s.id) {
    <g
      class="shape"
      [attr.data-id]="s.id"
      [attr.data-kind]="s.kind"
      [class.selected]="s.id === selectedId()"
      [class.invalid]="s.invalid"
      [class.locked]="!s.rect"
      [class.readonly]="readOnly()"
      role="button"
      tabindex="0"
      [attr.aria-label]="s.aria"
      (focus)="selectObject.emit(s.id)"
      (pointerdown)="onShapeDown($event, s)"
    >
      <polygon [attr.points]="s.points" />
      <text
        class="label"
        [attr.x]="s.center.x"
        [attr.y]="s.center.y + (s.sublabel ? 0 : s.fontSize / 3)"
        [attr.font-size]="s.fontSize"
        text-anchor="middle"
      >
        {{ s.label }}
      </text>
      @if (s.sublabel) {
        <text
          class="sublabel"
          [attr.x]="s.center.x"
          [attr.y]="s.center.y + s.fontSize * 0.9"
          [attr.font-size]="s.fontSize * 0.6"
          text-anchor="middle"
        >
          {{ s.sublabel }}
        </text>
      }
      @if (s.invalid) {
        <text
          class="warn"
          [attr.x]="s.center.x"
          [attr.y]="s.center.y - s.fontSize"
          [attr.font-size]="s.fontSize * 0.8"
          text-anchor="middle"
          aria-hidden="true"
        >
          ⚠
        </text>
      }
    </g>
  }

  @for (h of handles(); track h.handle) {
    <rect
      class="handle"
      [attr.data-handle]="h.handle"
      [attr.x]="h.x"
      [attr.y]="h.y"
      [attr.width]="h.size"
      [attr.height]="h.size"
      (pointerdown)="onHandleDown($event, h.handle)"
    />
  }
</svg>

<div class="zoom-controls">
  <button type="button" aria-label="Acercar" (click)="zoomIn()">+</button>
  <button type="button" aria-label="Alejar" (click)="zoomOut()">−</button>
  <button type="button" aria-label="Restablecer vista" (click)="resetView()">⤢</button>
</div>
<div class="scale-badge" aria-live="polite">{{ zoomPercent() }}% · 1 cuadro = 1 m</div>
