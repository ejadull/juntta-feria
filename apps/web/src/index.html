<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Juntta Feria</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#eef0f2" />
    <!-- Applies the saved palette before Angular boots (shared/theme.ts, same key and chrome table). -->
    <script>
      (function () {
        var chrome = {
          clasico: ['light', '#faf9f7'],
          corporativo: ['light', '#f8fafc'],
          grafito: ['dark', '#1a1a1d'],
          industrial: ['light', '#eef0f2'],
          matcha: ['light', '#b9c9a0'],
          cereza: ['light', '#fbeceb'],
        };
        var theme = 'industrial'; // default (Industrial Neon)
        try {
          var saved = localStorage.getItem('juntta.theme');
          if (saved && Object.prototype.hasOwnProperty.call(chrome, saved)) theme = saved;
        } catch (e) {
          // storage blocked: the default palette applies
        }
        // classic palette: no data-theme
        if (theme !== 'clasico') document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="color-scheme"]').content = chrome[theme][0];
        document.querySelector('meta[name="theme-color"]').content = chrome[theme][1];
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Inter from Google Fonts (UX-01 decision); system font is the fallback while it loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
