<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Juntta Feria</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#055851" />
    <!-- Applies the saved palette before Angular boots (shared/theme.ts, same key). -->
    <script>
      try {
        const theme = localStorage.getItem('juntta.theme');
        if (theme === 'corporativo' || theme === 'grafito')
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Inter from Google Fonts (UX-01 decision); system font is the fallback while it loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
